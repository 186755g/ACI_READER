<header><h1>مقارنة المنافست وكشف ACID</h1><p>كل المعالجة في المتصفح، والملفات ما بتتبعتش لأي سيرفر.</p></header><main>
<div class="g"><label class="drop" id="d1"><b>ملفات المنافست (PDF)</b>اسحب أو اضغط للاختيار<input id="f1" type="file" accept=".pdf" multiple hidden></label>
<label class="drop" id="d2"><b>ملفات كشف ACID (DOCX / XLSX / CSV)</b>اسحب أو اضغط للاختيار<input id="f2" type="file" accept=".docx,.xlsx,.xls,.csv" multiple hidden></label></div>
<div class="box" id="log" hidden></div><div class="box" id="info" hidden></div>

<select id="ty"><option value="">كل الأنواع</option><option>سيارات تصدير</option><option>سيارات تربتيك</option><option>بضاعة</option><option>شاحنات</option></select>
<label><input type="checkbox" id="hc" checked> إخفاء الملغي</label><input type="search" id="q" placeholder="بحث بالاسم أو ACID"><button id="ex">تصدير Excel</button><button id="pdf" title="اختار Save as PDF من نافذة الطباعة">تصدير PDF</button><button id="clr">مسح الكل</button></div>

<script>
const COMMON=new Set('محمد احمد محمود السيد عبد ابراهيم علي حسن مصطفي عبدالله ابو'.split(' '));
const norm=s=>String(s||'').replace(/[\u200e\u200f\u202a-\u202e\u0003]/g,' ').normalize('NFKC').replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/\s+/g,' ').trim();
const toks=s=>norm(String(s||'').replace(/\(.*?\)/g,' ')).split(' ').filter(w=>/^[\u0621-\u064A]{2,}$/.test(w));
const lev=(a,b)=>{let p=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){const c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[b.length]};
const lsim=(a,b)=>a||b?1-lev(a,b)/Math.max(a.length,b.length):0;
const hasGreek=s=>/[\u0380-\u03ff]/.test(s);
// فك الترميز: حروف يونانية -> عربية، وقلب المقاطع العربية فقط (الأرقام واللاتيني تفضل زي ما هي)
function dec(s){s=s.replace(/\u0003/g,' ').replace(/\u0012/g,'/');let o='';for(const c of s){const k=c.charCodeAt(0);o+=k>=0x380&&k<=0x3ff?String.fromCharCode(0xfe00+k-0x300):c}
  o=o.normalize('NFKC');return o.split(/([A-Za-z0-9]+)/).map((p,i)=>i%2?p:[...p].reverse().join('')).join('').replace(/\s+/g,' ').trim()}
const typeOf=p=>/^BSVXS/.test(p)?'سيارات تصدير':/^BSVS/.test(p)?'سيارات تربتيك':/^BSCS/.test(p)?'بضاعة':/^BSES/.test(p)?'شاحنات':'';
const POL=/^BS[A-Z]{2,3}\d{4,7}[A-D]?$/;
const cleanName=s=>toks(s).filter(w=>!/^(بدون|صحبه|فارغ|لوحه|رقم|شاسيه)$/.test(w)).join(' ');

function parseTypeA(items,fileName,page){
  const H={};for(const it of items){const t=it.str.trim();if(['cons','shipperTaxNu','consTaxNum','acid','sub_num','descr','weight','package'].includes(t))H[t]=it.x+it.w/2}
  if(!H.cons||!H.acid||!H.sub_num)return[];
  const colOf=it=>{const c=it.x+it.w/2;let b='',d=1e9;for(const k in H){const e=Math.abs(H[k]-c);if(e<d){d=e;b=k}}return b};
  const pols=items.filter(i=>POL.test(i.str.trim())||/^BS[A-Z]{2,3}\d{4,7}$/.test(i.str.trim())).sort((a,b)=>b.y-a.y);
  const rows=[];
  pols.forEach((p,i)=>{
    const top=p.y+8,bot=i+1<pols.length?pols[i+1].y+8:-1e9;
    const band=items.filter(it=>it.y<=top&&it.y>bot).sort((a,b)=>b.y-a.y||b.x-a.x);
    const col=k=>band.filter(it=>colOf(it)===k&&it!==p);
    let pol=p.str.trim();
    for(const it of col('sub_num')){const t=it.str.trim();if(/^\d+$/.test(t)&&pol.replace(/\D/g,'').length<7)pol+=t;else if(/^[A-D]$/.test(t)&&pol.replace(/\D/g,'').length>=7)pol+=t}
    const digits=k=>col(k).map(i=>i.str.trim()).filter(t=>/^\d+$/.test(t)).join('');
    let acid=digits('acid');if(!/^\d{19}$/.test(acid))acid=acid.length>19?acid.slice(0,19):acid;
    let id=digits('consTaxNum');if(id.length!==14)id=digits('shipperTaxNu')
    const name=cleanName(col('cons').map(i=>i.str).join(' '));
    rows.push({file:fileName,page,policy:pol,type:typeOf(pol),name,acid,nid:id,canceled:band.some(i=>/cancel/i.test(i.str))});
  });return rows}

function parseTypeB(items,fileName,page){
  const rows=[];let buf=[];
  for(const it of items){const s=dec(it.str);if(!s)continue;
    if(/^BS[A-Z]{2,3}\d{7}[A-D]?$/.test(s)){
      const ac=buf.find(t=>/^\d{19}$/.test(t));const ii=buf.map(t=>/^\d{14}$/.test(t)).lastIndexOf(true);
      const nm=[];for(let k=ii-1;k>=0&&nm.length<3;k--){if(/^[\u0621-\u064A ]+$/.test(buf[k])&&!/سيارة|شاسيه|لوحة|فارغ|تصدير/.test(buf[k]))nm.unshift(buf[k]);else break}
      rows.push({file:fileName,page,policy:s,type:typeOf(s),name:cleanName(nm.join(' ')),acid:ac||'',nid:ii>=0?buf[ii]:'',canceled:buf.some(t=>/cancel/i.test(t))});buf=[]}
    else buf.push(s)}
  return rows}

async function readPdf(file,pdfjs,log){
  const pdf=await pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;const all=[];let type='';
  for(let n=1;n<=pdf.numPages;n++){try{
    const tc=await(await pdf.getPage(n)).getTextContent();
    const items=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({str:i.str,x:i.transform[4],y:i.transform[5],w:i.width||0}));
    if(!type)type=items.some(i=>hasGreek(i.str))?'B':'A';
    const r=(type==='B'?parseTypeB:parseTypeA)(items,file.name,n);all.push(...r);
    if(!r.length)log&&log(`الصفحة ${n} من ${file.name}: لم تُقرأ`);
  }catch(e){log&&log(`فشل قراءة الصفحة ${n} من ${file.name}`)}}
  return{rows:all,type}}

function nameScore(a,b){const x=toks(a),y=toks(b);if(!x.length||!y.length)return{s:0,m:0,d:0};
  const used=new Set();let m=0,d=0;for(const t of x){let bj=-1,bs=.85;y.forEach((u,j)=>{if(!used.has(j)){const s=lsim(t,u);if(s>=bs){bs=s;bj=j}}});if(bj>=0){used.add(bj);m++;if(!COMMON.has(t))d++}}
  const s=Math.max(2*m/(x.length+y.length),lsim(x.join(''),y.join('')));return{s:Math.round(s*100),m,d}}

function compare(man,sheet,th){
  const R={full:[],acidMismatch:[],nameSimilar:[],acidNear:[]},byAcid=new Map(sheet.filter(r=>r.acid).map(r=>[r.acid,r]));
  for(const m of man){
    if(m.acid&&byAcid.has(m.acid)){const s=byAcid.get(m.acid),n=nameScore(m.name,s.name);R[n.s>=th?'full':'acidMismatch'].push({m,s,score:n.s});continue}
    for(const s of sheet){
      if(m.acid&&s.acid&&m.acid.length===s.acid.length&&lev(m.acid,s.acid)===1)R.acidNear.push({m,s,score:99});
      const n=nameScore(m.name,s.name);if(n.s>=th&&n.m>=2&&n.d>=1)R.nameSimilar.push({m,s,score:n.s})}}
  return R}

function sheetFromRows(rows,fileName){const out=[];let ci=1,ai=2;
  for(const r of rows){const c=r.map(x=>String(x??'').replace(/\s+/g,' ').trim());
    const h=c.findIndex(x=>/ACID/i.test(x)&&!/^\d/.test(x));if(h>=0){ai=h;const n=c.findIndex(x=>/اسم/.test(x));ci=n>=0?n:Math.max(0,h-1);continue}
    const acid=(c[ai]||'').replace(/\D/g,'');if(acid.length>=8&&c[ci])out.push({file:fileName,name:c[ci],acid,note:c.slice(ai+1).join(' ')})}
  return out}


pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=id=>document.getElementById(id),S={man:[],sheet:[],R:null,tab:'full'};
const L={full:'تطابق كامل',acidMismatch:'ACID متطابق والاسم مختلف',nameSimilar:'اسم متشابه وACID مختلف',acidNear:'ACID قريب'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const log=m=>{$('log').hidden=false;const d=document.createElement('div');d.textContent=m;$('log').appendChild(d)};
async function readSheet(f){const e=f.name.split('.').pop().toLowerCase();let rows=[];
  if(e==='docx'){const h=(await mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()})).value,d=new DOMParser().parseFromString(h,'text/html');
    rows=[...d.querySelectorAll('tr')].map(t=>[...t.querySelectorAll('td,th')].map(c=>c.textContent))}
  else{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});for(const n of wb.SheetNames)rows.push(...XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false}))}
  return sheetFromRows(rows,f.name)}
async function add(files,kind){for(const f of files){try{
  if(kind==='m'){const r=await readPdf(f,pdfjsLib,log);S.man.push(...r.rows);log0(`${f.name}: ${r.rows.length} صف (نوع ${r.type})`)}
  else{const r=await readSheet(f);S.sheet.push(...r);log0(`${f.name}: ${r.length} اسم`)}}catch(e){log('تعذرت قراءة '+f.name+': '+e.message)}}show()}
const info=[];function log0(m){info.push(m)}
function show(){$('info').hidden=false;const bad=S.man.filter(r=>/VXS/.test(r.policy)&&r.acid.length!==19).length;
  $('info').innerHTML=info.map(esc).join('<br>')+`<div class="mu">منافست: ${S.man.length} صف | سيارات تصدير ACID ناقص: ${bad} | كشف: ${S.sheet.length} اسم</div>`}
function pass(r){return(!$('ty').value||r.type===$('ty').value)&&!($('hc').checked&&r.canceled)}
function draw(){if(!S.R)return;const q=norm($('q').value),F={};
  for(const k in L)F[k]=S.R[k].filter(x=>pass(x.m)&&(!q||norm(x.m.name+' '+x.s.name).includes(q)||(x.m.acid+x.s.acid).includes(q)));
  $('tabs').innerHTML=Object.keys(L).map(k=>`<button data-k="${k}" class="${S.tab===k?'on':''}">${L[k]} (${F[k].length})</button>`).join('');
  const a=F[S.tab];$('out').innerHTML=a.length?`<table><tr><th>الملف</th><th>البوليصة</th><th>اسم المنافست</th><th>اسم الكشف</th><th>ACID المنافست</th><th>ACID الكشف</th><th>التشابه</th></tr>`+
   a.map(x=>`<tr><td>${esc(x.m.file)}</td><td class="n">${esc(x.m.policy)}</td><td>${esc(x.m.name)}</td><td>${esc(x.s.name)}</td><td class="n">${esc(x.m.acid)}</td><td class="n">${esc(x.s.acid)}</td><td>${x.score}%</td></tr>`).join('')+'</table>':'<p class="mu">مفيش نتايج في الفئة دي.</p>';
  window._F=F}
function buildPrintRows(items){if(!items||!items.length)return '<div class="print-empty">مفيش نتايج</div>';
  return `<table class="print-table"><thead><tr><th>م</th><th>الملف</th><th>رقم البوليصة</th><th>اسم المنافست</th><th>اسم الكشف</th><th>ACID المنافست</th><th>ACID الكشف</th><th>نسبة التشابه</th></tr></thead><tbody>${items.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.m.file)}</td><td class="ltr">${esc(x.m.policy)}</td><td>${esc(x.m.name)}</td><td>${esc(x.s.name)}</td><td class="ltr">${esc(x.m.acid)}</td><td class="ltr">${esc(x.s.acid)}</td><td>${x.score}%</td></tr>`).join('')}</tbody></table>`;}
function renderPrintReport(){const F=window._F||{};const q=norm($('q').value);const type=$('ty').value;const hide=$('hc').checked;const summary=[`ملفات المنافست: ${S.man.map(r=>r.file).filter((v,i,a)=>a.indexOf(v)===i).join(', ')||'لا توجد'}`,
  `عدد صفوف كل ملف: ${S.man.length ? S.man.map(r=>r.file).filter((v,i,a)=>a.indexOf(v)===i).map(f=>`${f}: ${S.man.filter(x=>x.file===f).length}`).join(' | ') : '0'}`,
  `ملفات الكشف: ${S.sheet.map(r=>r.file).filter((v,i,a)=>a.indexOf(v)===i).join(', ')||'لا توجد'}`,
  `عدد الأسماء: ${S.sheet.length}`,
  `نسبة التشابه: ${$('th').value}%`,
  `نوع الشحنة: ${type||'كل الأنواع'}`,
  `إخفاء الملغي: ${hide?'نعم':'لا'}`,
  `نص البحث: ${q||'بدون'}`].join(' | ');
  const html=`<div class="print-report"><div class="print-header"><h2>تقرير مقارنة المنافست وكشف ACID</h2><div>${new Date().toLocaleString('ar-EG')}</div></div><div class="print-summary">${summary}</div>${Object.keys(L).map(k=>`<section class="print-section"><h3>${L[k]} (${(F[k]||[]).length})</h3>${buildPrintRows(F[k]||[])}</section>`).join('')}</div>`;
  $('printArea').innerHTML=html;}
function printCurrentReport(){if(!S.R||!window._F){log('اعمل المقارنة الأول.');return;}renderPrintReport();window.print();setTimeout(()=>{$('printArea').innerHTML='';},300);}
$('go').onclick=()=>{if(!S.man.length||!S.sheet.length)return log('ارفع ملفات المنافست وملفات الكشف الأول.');S.R=compare(S.man,S.sheet,+$('th').value);$('res').hidden=false;draw()};
$('th').oninput=()=>{$('tv').textContent=$('th').value+'%';if(S.R)$('go').click()};
['ty','hc','q'].forEach(i=>$(i).addEventListener('input',draw));
$('tabs').onclick=e=>{const b=e.target.closest('button');if(b){S.tab=b.dataset.k;draw()}};
$('clr').onclick=()=>{S.man=[];S.sheet=[];S.R=null;info.length=0;$('info').hidden=$('res').hidden=$('log').hidden=true;$('log').innerHTML=''};
$('ex').onclick=()=>{if(!window._F)return log('اعمل المقارنة الأول.');const wb=XLSX.utils.book_new();
  for(const k in L){const rows=[['الملف','البوليصة','اسم المنافست','اسم الكشف','ACID المنافست','ACID الكشف','التشابه']].concat(window._F[k].map(x=>[x.m.file,x.m.policy,x.m.name,x.s.name,x.m.acid,x.s.acid,x.score+'%']));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),L[k].slice(0,31))}XLSX.writeFile(wb,'نتائج-المقارنة.xlsx')};
$('pdf').onclick=printCurrentReport;
for(const[i,d,k]of[['f1','d1','m'],['f2','d2','s']]){$(i).onchange=async e=>{await add(e.target.files,k);e.target.value=''};
  $(d).ondragover=e=>{e.preventDefault();$(d).classList.add('on')};$(d).ondragleave=()=>$(d).classList.remove('on');
  $(d).ondrop=async e=>{e.preventDefault();$(d).classList.remove('on');await add(e.dataTransfer.files,k)}}
</script></body></html>
